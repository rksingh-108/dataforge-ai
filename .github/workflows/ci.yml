name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  boundaries:
    name: Service boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Check boundary rules
        run: python scripts/dev/check_boundaries.py

  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dataforge
          POSTGRES_PASSWORD: dataforge
          POSTGRES_DB: dataforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dataforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5432"
      TEST_DB_USER: dataforge
      TEST_DB_PASSWORD: dataforge
      TEST_DB_NAME: dataforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/requirements/dev.txt
      - name: Install dependencies
        run: pip install -r apps/api/requirements/dev.txt
      - name: Ruff
        run: ruff check apps/api
      - name: Run tests
        working-directory: apps/api
        run: pytest --cov=apps --cov-report=term-missing --cov-fail-under=70
      - name: Django system checks (deploy)
        working-directory: apps/api
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-placeholder-secret-key-that-is-long-enough-000000
          DATAFORGE_FERNET_KEY: S0kzq9cH6m3z8bV2Vw0i1pQ4sB7nE5tR2yU6iO9aX0M=
          INTERNAL_SERVICE_TOKEN: ci-placeholder-internal-token-000000000000
          CSRF_TRUSTED_ORIGINS: https://app.example.com
        run: python manage.py check --deploy

  ai-service:
    name: AI service (Flask)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/ai-service/requirements/dev.txt
      - name: Install dependencies
        run: pip install -r apps/ai-service/requirements/dev.txt
      - name: Ruff
        run: ruff check apps/ai-service
      - name: Run tests
        working-directory: apps/ai-service
        run: pytest --cov=ai_service --cov-report=term-missing --cov-fail-under=70

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Type check
        working-directory: apps/web
        run: npm run typecheck
      - name: Unit tests
        working-directory: apps/web
        run: npm run test
      - name: Production build
        working-directory: apps/web
        env:
          API_BASE_URL: http://localhost:8000
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [boundaries]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t dataforge-api:ci .
      - name: Build AI service image
        run: docker build -f apps/ai-service/Dockerfile -t dataforge-ai:ci .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t dataforge-web:ci .
      - name: Validate compose file
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-password/' .env
          docker compose config --quiet
