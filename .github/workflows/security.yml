name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Weekly re-scan, so new advisories surface without a push.

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked files for credentials
        run: bash scripts/dev/scan_secrets.sh

  python-security:
    name: Python security analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install tooling
        run: |
          pip install -r apps/api/requirements/dev.txt
          pip install -r apps/ai-service/requirements/dev.txt
      # The scan is enforcing: the shared config in pyproject.toml documents every
      # skip, so a new finding fails the job instead of being silently ignored.
      - name: bandit (API)
        run: bandit -c pyproject.toml -q -r apps/api/apps -f json -o bandit-api.json
      - name: bandit (AI service)
        run: bandit -c pyproject.toml -q -r apps/ai-service/ai_service
      - name: pip-audit (API)
        run: pip-audit -r apps/api/requirements/base.txt
      - name: pip-audit (AI service)
        run: pip-audit -r apps/ai-service/requirements/base.txt
      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-api.json
          if-no-files-found: ignore

  security-tests:
    name: Security test suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dataforge
          POSTGRES_PASSWORD: dataforge
          POSTGRES_DB: dataforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dataforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5432"
      TEST_DB_USER: dataforge
      TEST_DB_PASSWORD: dataforge
      TEST_DB_NAME: dataforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/requirements/dev.txt
      - name: Install dependencies
        run: pip install -r apps/api/requirements/dev.txt
      - name: Run security tests
        working-directory: apps/api
        run: pytest tests/security -q

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  frontend-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
