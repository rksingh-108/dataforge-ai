[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = tests.py test_*.py *_tests.py
testpaths = apps tests
pythonpath = .
addopts =
    -ra
    --strict-markers
    --ds=config.settings.test
markers =
    requires_postgres: test needs a real PostgreSQL+pgvector database
    requires_docker: test needs a live container/service
